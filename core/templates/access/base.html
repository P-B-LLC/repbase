<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Rytivo · Administration</title>
<style>
:root{color-scheme:light dark;--bg:#fff;--ink:#171717;--muted:#656565;--line:#ddd;--accent:#d43f08}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.5 system-ui,-apple-system,sans-serif}main{max-width:760px;padding:32px 22px 70px;margin:auto}header{padding:18px 22px;border-bottom:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:20px}a{color:var(--accent)}h1{font-size:32px;letter-spacing:-1px}p,.muted{color:var(--muted)}button,.button{display:inline-block;border:0;border-radius:12px;background:var(--ink);color:var(--bg);padding:12px 18px;font:inherit;cursor:pointer;text-decoration:none}input:not([type=checkbox]){width:100%;padding:13px;margin:8px 0 18px;border:1px solid var(--line);border-radius:10px;background:var(--bg);color:var(--ink);font:inherit}input[type=checkbox]{margin-right:10px;accent-color:var(--accent);width:20px;height:20px}label{display:block;margin:14px 0}section,article{padding:20px 0;border-bottom:1px solid var(--line)}.errorlist,[role=alert]{color:#c92c20}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--accent);outline-offset:3px}.row{display:flex;gap:15px;align-items:center;justify-content:space-between}.row form{margin:0}nav{display:flex;gap:20px;margin-top:24px}.tag{font-size:13px;color:var(--muted)}@media(prefers-color-scheme:dark){:root{--bg:#171717;--ink:#f7f7f7;--muted:#bcbcbc;--line:#414141;--accent:#ff824e}}
</style></head><body><header><strong>Rytivo</strong>{% if user.is_authenticated %}<form action="{% url 'access-logout' %}" method="post">{% csrf_token %}<button>Sign out of administration</button></form>{% endif %}</header><main>{% block content %}{% endblock %}</main></body></html>
