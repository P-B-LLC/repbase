<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>{% block title %}Rytivo · Private insights{% endblock %}</title>
<style>
:root{color-scheme:light;--paper:#f5f5f0;--ink:#19251f;--muted:#606a64;--line:#dce1d9;--orange:#cb390a;--sage:#dfe9df}*{box-sizing:border-box}body{margin:0;background:var(--paper);color:var(--ink);font:15px/1.5 system-ui,-apple-system,sans-serif}a{color:inherit}button,input{font:inherit}button,.button{display:inline-block;background:var(--ink);color:white;border:0;border-radius:10px;padding:11px 18px;cursor:pointer;text-decoration:none}button:focus-visible,a:focus-visible,input:focus-visible{outline:3px solid var(--orange);outline-offset:4px}header{border-bottom:1px solid var(--line);background:white;padding:20px 5%;display:flex;align-items:center;justify-content:space-between;gap:20px}.brand{font-size:22px;font-weight:750;letter-spacing:-1px}.brand span{color:var(--orange)}.private{font-size:11px;letter-spacing:2px;color:var(--muted);margin-left:18px}main{max-width:1240px;margin:auto;padding:42px 28px 60px}.eyebrow{font-size:11px;text-transform:uppercase;letter-spacing:2px;color:var(--orange);font-weight:700}h1{font-size:clamp(30px,4vw,46px);line-height:1.1;letter-spacing:-1.7px;margin:12px 0}h2{font-size:20px;letter-spacing:-.5px;margin:0 0 18px}p{color:var(--muted)}.hero{display:flex;justify-content:space-between;align-items:center;gap:24px;margin-bottom:26px}.range{display:flex;gap:5px;border:1px solid var(--line);padding:5px;border-radius:12px;white-space:nowrap}.range a{padding:9px 14px;text-decoration:none;border-radius:8px}.range .selected{background:var(--ink);color:white}.notice{background:#fff1db;border:1px solid #e5cca4;padding:14px 18px;border-radius:12px;margin-bottom:22px}.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:16px}.card,.panel{border:1px solid var(--line);background:white;border-radius:18px;padding:24px}.card:first-child{background:var(--sage)}.label{color:var(--muted);font-size:13px}.value{font-size:38px;letter-spacing:-1.5px;margin:9px 0;font-weight:650}.note{font-size:12px;color:var(--muted)}.panels{display:grid;grid-template-columns:1fr 1.5fr;gap:20px;margin:24px 0}.bar-row{display:grid;grid-template-columns:58px 1fr 55px;gap:10px;align-items:center;font-size:12px;margin:12px 0}.track{background:#edf0eb;border-radius:5px;height:9px;overflow:hidden}.bar{height:100%;background:#59735e;border-radius:5px}.table-wrap{overflow-x:auto}table{width:100%;border-collapse:collapse;font-size:12px}th,td{text-align:left;padding:12px 8px;border-bottom:1px solid var(--line)}th{color:var(--muted);font-weight:500}td:first-child{max-width:260px;overflow-wrap:anywhere}td:not(:first-child),th:not(:first-child){text-align:right}.empty{padding:30px 0;color:var(--muted)}.foot{font-size:12px;max-width:950px}.login{max-width:450px;margin:40px auto}.login input{width:100%;padding:12px;border:1px solid #859188;border-radius:9px;background:white}.login label{display:block;color:var(--ink);font-weight:600;margin-bottom:7px}.login button{width:100%;margin-top:14px}.errorlist{color:#a32016;padding-left:20px;font-size:13px}footer{border-top:1px solid var(--line);padding:22px 5%;color:var(--muted);font-size:12px}.pill{display:inline-block;background:#edf3ed;color:#34543b;border-radius:99px;padding:5px 11px;font-size:11px}@media(max-width:850px){.panels{grid-template-columns:1fr}.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}@media(max-width:520px){main{padding:28px 16px}.hero{align-items:flex-start;flex-direction:column}.grid{grid-template-columns:1fr}.private{display:none}.card{padding:20px}.value{font-size:32px}}

/* Reading the numbers: a change beside each total, the exceptions first, and
   a curve drawn rather than scripted -- the page runs with default-src
   'none', so there is no chart library and no script of any kind. */
:root{--danger:#a32016;--danger-soft:#fbecea;--warn:#8a5a0b;--warn-soft:#fdf3e2;--good:#2f6b3f}
.delta{font-size:12px;font-weight:600;margin-bottom:8px}
.delta.good{color:var(--good)}
.delta.bad{color:var(--danger)}
.delta.flat{color:var(--muted);font-weight:500}

.attention-block{margin:26px 0}
.attention-block h2{margin-bottom:6px}
.attention{list-style:none;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:14px;padding:0;margin:16px 0 0}
.attention .item{border:1px solid var(--line);border-left:4px solid var(--muted);background:white;border-radius:14px;padding:18px 20px}
.attention .item.error{border-left-color:var(--danger);background:var(--danger-soft)}
.attention .item.slow{border-left-color:var(--warn);background:var(--warn-soft)}
.item-head{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-bottom:8px}
.sev{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;font-weight:800}
.item.error .sev{color:var(--danger)}
.item.slow .sev{color:var(--warn)}
.item-head code{font-size:12px;overflow-wrap:anywhere}
.item-value{font-size:22px;font-weight:650;letter-spacing:-.6px;margin-bottom:4px}
.do{font-size:13px;color:var(--ink);font-weight:550;margin:10px 0 0}
.all-clear{border:1px solid var(--line);background:var(--sage);border-radius:14px;padding:20px 22px;margin-top:14px}
.all-clear p{margin:6px 0 0}

.panels.two{grid-template-columns:1fr 1fr}
.panel.wide{margin:24px 0}
.ratio{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap}
.ratio .big{font-size:40px;font-weight:680;letter-spacing:-1.6px}
.ratio .note{flex:1;min-width:180px}
.meter{background:#edf0eb;border-radius:6px;height:11px;overflow:hidden;margin:14px 0 0}
.meter .fill{height:100%;background:#59735e;border-radius:6px}
.split{display:flex;height:11px;border-radius:6px;overflow:hidden;margin:14px 0 0;background:#edf0eb}
.split .kept{background:#59735e}
.split .lost{background:var(--danger)}
.legend{list-style:none;display:flex;flex-wrap:wrap;gap:16px;padding:0;margin:12px 0 0;font-size:12px;color:var(--muted)}
.legend li{display:flex;align-items:center;gap:6px}
.key{width:10px;height:10px;border-radius:3px;display:inline-block}
.key.kept{background:#59735e}
.key.lost{background:var(--danger)}
.key.fresh{background:var(--orange)}

.chart{width:100%;height:190px;display:block;margin:6px 0 0;overflow:visible}
.chart-area{fill:#59735e;fill-opacity:.13}
.chart-line{fill:none;stroke:#59735e;stroke-width:3;stroke-linejoin:round;stroke-linecap:round;vector-effect:non-scaling-stroke}
.chart-dot{fill:white;stroke:#59735e;stroke-width:3;vector-effect:non-scaling-stroke}
.chart-days{list-style:none;display:flex;justify-content:space-between;gap:8px;padding:0;margin:14px 0 0;font-size:11px}
.chart-days li{display:flex;flex-direction:column;gap:2px;min-width:0}
.chart-days .d{color:var(--muted)}
.chart-days .n{font-weight:700;font-size:15px}
.chart-days .note{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

tr.row-error td{background:var(--danger-soft)}
tr.row-slow td{background:var(--warn-soft)}

@media(max-width:850px){.attention{grid-template-columns:1fr}.panels.two{grid-template-columns:1fr}}
@media(max-width:520px){.chart-days{display:grid;grid-template-columns:repeat(2,minmax(0,1fr))}.ratio .big{font-size:32px}}
</style></head><body>
<header><div class="brand">Rytivo<span>.</span><span class="private">PRIVATE INSIGHTS</span></div>{% block header %}{% endblock %}</header>
<main>{% block content %}{% endblock %}</main>
<footer><a href="/account">Back to Rytivo</a> · First-party analytics · No advertising trackers</footer>
</body></html>
