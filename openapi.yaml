          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
