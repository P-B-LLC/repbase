openapi: 3.0.3
info:
  title: Repbase API
  version: 1.0.0
  description: Versioned API for the Repbase iOS application.
paths:
  /api/v1/auth/login/:
    post:
      operationId: auth_login_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/LoginRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/logout/:
    post:
      operationId: auth_logout_create
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/:
    post:
      operationId: auth_password_reset_create
      description: Emails a six digit reset code. Answers 204 whether or not the address
        belongs to an account.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetRequestRequest'
        required: true
      security:
      - {}
      responses:
        '204':
          description: No response body
  /api/v1/auth/password-reset/confirm/:
    post:
      operationId: auth_password_reset_confirm_create
      description: Sets a new password using the emailed code, signs every other session
        out, and returns a fresh token.
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PasswordResetConfirmRequest'
        required: true
      security:
      - {}
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/register/:
    post:
      operationId: auth_register_create
      tags:
      - auth
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/RegisterRequest'
        required: true
      security:
      - {}
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/auth/rotate-token/:
    post:
      operationId: auth_rotate_token_create
      tags:
      - auth
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthResponse'
          description: ''
  /api/v1/body-weight/:
    get:
      operationId: body_weight_list
      parameters:
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - body-weight
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedBodyWeightEntryList'
          description: ''
    post:
      operationId: body_weight_create
      tags:
      - body-weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyWeightEntry'
          description: ''
  /api/v1/body-weight/{id}/:
    get:
      operationId: body_weight_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this body weight entry.
        required: true
      tags:
      - body-weight
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyWeightEntry'
          description: ''
    put:
      operationId: body_weight_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this body weight entry.
        required: true
      tags:
      - body-weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/BodyWeightEntryRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyWeightEntry'
          description: ''
    patch:
      operationId: body_weight_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this body weight entry.
        required: true
      tags:
      - body-weight
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedBodyWeightEntryRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedBodyWeightEntryRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedBodyWeightEntryRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/BodyWeightEntry'
          description: ''
    delete:
      operationId: body_weight_destroy
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this body weight entry.
        required: true
      tags:
      - body-weight
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cycles/:
    get:
      operationId: cycles_list
      description: Rotations that repeat every N days rather than every week.
      parameters:
      - in: query
        name: include_ended
        schema:
          type: boolean
        description: Include rotations that have been closed. Off by default, because
          most screens want the one you are on -- but a list you choose from needs
          the ones you are not.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - cycles
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedWorkoutCycleList'
          description: ''
    post:
      operationId: cycles_create
      description: Rotations that repeat every N days rather than every week.
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
  /api/v1/cycles/{id}/:
    get:
      operationId: cycles_retrieve
      description: Rotations that repeat every N days rather than every week.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
    put:
      operationId: cycles_update
      description: Rotations that repeat every N days rather than every week.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/WorkoutCycleRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
    patch:
      operationId: cycles_partial_update
      description: Rotations that repeat every N days rather than every week.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedWorkoutCycleRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedWorkoutCycleRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedWorkoutCycleRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
    delete:
      operationId: cycles_destroy
      description: Rotations that repeat every N days rather than every week.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/cycles/{id}/activate/:
    post:
      operationId: cycles_activate_create
      description: Make this the rotation you are on, from `start_on` -- today if
        it is left out. Whatever is running keeps its days right up to that date and
        is closed there; this one begins at day 1 on it, and the calendar is written
        forward from there.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleActivateRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CycleActivateRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CycleActivateRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
  /api/v1/cycles/{id}/plan-ahead/:
    post:
      operationId: cycles_plan_ahead_create
      description: Writes schedule rows for the rotation up to a date.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CyclePlanAheadRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CyclePlanAheadRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CyclePlanAheadRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/WorkoutCycle'
          description: ''
  /api/v1/cycles/{id}/resume-today/:
    post:
      operationId: cycles_resume_today_create
      description: |-
        Makes the next workout in the rotation happen today.

        For somebody who has already drifted: rather than counting how many
        days behind they are, the rotation is re-anchored so the workout they
        owe lands on today and the rest follows from there.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleShiftResult'
          description: ''
  /api/v1/cycles/{id}/shift/:
    post:
      operationId: cycles_shift_create
      description: |-
        Pushes the rest of the rotation back, after an unplanned rest day.

        The anchor moves and every future date moves with it. That is the whole
        reason a rotation is anchored to a date: a weekly rule could only be
        shifted by becoming a rule about a different weekday.
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this workout cycle.
        required: true
      tags:
      - cycles
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CycleShiftRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CycleShiftRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CycleShiftRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CycleShiftResult'
          description: ''
  /api/v1/exercises/:
    get:
      operationId: exercises_list
      parameters:
      - in: query
        name: name
        schema:
          type: string
        description: Return only exercises with this exact name, matched without regard
          to case or surrounding space. Lets a client resolve one exercise instead
          of reading every page of the catalogue to find it.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - exercises
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedExerciseList'
          description: ''
    post:
      operationId: exercises_create
      tags:
      - exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
          description: ''
  /api/v1/exercises/{id}/:
    get:
      operationId: exercises_retrieve
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise.
        required: true
      tags:
      - exercises
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
          description: ''
    put:
      operationId: exercises_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise.
        required: true
      tags:
      - exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/ExerciseRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Exercise'
          description: ''
    patch:
      operationId: exercises_partial_update
      parameters:
      - in: path
        name: id
        schema:
          type: integer
        description: A unique integer value identifying this exercise.
        required: true
      tags:
      - exercises
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedExerciseRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedExerciseRequest'
          multipart/form-data:
            schema:
