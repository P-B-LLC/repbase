    Post:
      type: object
      description: |-
        A post as anyone allowed to see it reads it.

        `workout`, `meal` and `planner` are three keys side by side with exactly one
        of them filled in, rather than one field whose type is chosen by `kind`. A
        client built before a fourth kind existed then fails to draw that one post;
        with a discriminated union it fails to decode the whole page around it.

        `kind` and `visibility` go out as plain strings for the same reason: a value
        added later should be a string the client does not recognise, not a decoding
        error. Requests still take a closed set — see `CreatePostSerializer`.

        Every field here is read-only. A post is created from a source it does not
        carry and edited through `UpdatePostSerializer`, so there is no shape in
        which this serializer accepts anything.
      properties:
        id:
          type: integer
          readOnly: true
        author:
          allOf:
          - $ref: '#/components/schemas/PublicRepbaseUser'
          readOnly: true
        kind:
          type: string
          readOnly: true
        image_url:
          type: string
          nullable: true
          readOnly: true
        feed_image_url:
          type: string
          nullable: true
          readOnly: true
        caption:
          type: string
          readOnly: true
        visibility:
          type: string
          readOnly: true
        workout:
          allOf:
          - $ref: '#/components/schemas/PostWorkout'
          readOnly: true
          nullable: true
        meal:
          allOf:
          - $ref: '#/components/schemas/PostMeal'
          readOnly: true
          nullable: true
        planner:
          allOf:
          - $ref: '#/components/schemas/PostPlannerEntry'
          readOnly: true
          nullable: true
        source_id:
          type: integer
          nullable: true
          readOnly: true
        viewer_follows_author:
          type: boolean
          readOnly: true
        shows_weights:
          type: boolean
          readOnly: true
        viewer_is_author:
          type: boolean
          readOnly: true
        like_count:
          type: integer
          readOnly: true
        comment_count:
          type: integer
          readOnly: true
        repost_count:
          type: integer
          readOnly: true
        viewer_has_liked:
          type: boolean
          readOnly: true
        viewer_has_reposted:
          type: boolean
          readOnly: true
        viewer_saved:
          type: boolean
          readOnly: true
        repost_of:
          allOf:
          - $ref: '#/components/schemas/RepostedPost'
          nullable: true
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - caption
      - comment_count
      - created_at
      - feed_image_url
      - id
      - image_url
      - kind
      - like_count
      - meal
      - planner
      - repost_count
      - repost_of
      - shows_weights
      - source_id
      - updated_at
      - viewer_follows_author
      - viewer_has_liked
      - viewer_has_reposted
      - viewer_is_author
      - viewer_saved
      - visibility
      - workout
    PostComment:
      type: object
      description: |-
        A comment, and the replies hanging off it.

        `replies` is filled only for a top-level comment, and is never more than
        one deep because the model refuses a reply to a reply. The client can
        therefore render a thread without walking anything.
      properties:
        id:
          type: integer
          readOnly: true
        post:
          type: integer
        author:
          allOf:
          - $ref: '#/components/schemas/PublicRepbaseUser'
          readOnly: true
        parent:
          type: integer
          nullable: true
        body:
          type: string
          maxLength: 1000
        replies:
          type: array
          items:
            $ref: '#/components/schemas/PostReply'
          readOnly: true
        viewer_is_author:
          type: boolean
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - author
      - body
      - created_at
      - id
      - post
      - replies
      - updated_at
      - viewer_is_author
    PostCommentRequest:
      type: object
      description: |-
