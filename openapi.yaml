        protein_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        carbohydrate_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        fat_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
    PatchedPersonalizationRequest:
      type: object
      description: |-
        The three answers, as the app already spells them.

        The list is checked for shape but not for membership: it holds whatever
        the app currently offers, and a choice retired from the app should not turn
        an existing account into a validation error on read.
      properties:
        training_types:
          type: array
          items:
            type: string
            minLength: 1
            maxLength: 60
        weekly_target:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        emphasis:
          type: string
          maxLength: 40
    PatchedPlannerEntryRequest:
      type: object
      description: |-
        A task or event on the planner.

        ``is_complete`` is what the client writes; ``completed_at`` is the record
        of when it happened and is read-only. Keeping both means ticking a task off
        does not throw away the time it was done.
      properties:
        kind:
          allOf:
          - $ref: '#/components/schemas/PlannerEntryKindEnum'
          default: task
        title:
          type: string
          minLength: 1
          maxLength: 150
        category:
          $ref: '#/components/schemas/CategoryEnum'
        priority:
          $ref: '#/components/schemas/PriorityEnum'
        scheduled_date:
          type: string
          format: date
        scheduled_time:
          type: string
          format: time
          nullable: true
        duration_minutes:
          type: integer
          maximum: 1440
          minimum: 5
          nullable: true
        is_complete:
          type: boolean
        workout:
          type: integer
          nullable: true
        notes:
          type: string
          maxLength: 300
    PatchedPostCommentRequest:
      type: object
      description: |-
        A comment, and the replies hanging off it.

        `replies` is filled only for a top-level comment, and is never more than
        one deep because the model refuses a reply to a reply. The client can
        therefore render a thread without walking anything.
      properties:
        post:
          type: integer
        parent:
          type: integer
          nullable: true
        body:
          type: string
          minLength: 1
          maxLength: 1000
    PatchedRepbaseUserRequest:
