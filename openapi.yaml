        reason:
          type: string
          readOnly: true
        already_reported:
          type: boolean
          readOnly: true
      required:
      - already_reported
      - reason
    PostWorkout:
      type: object
      description: |-
        A posted workout, frozen at the moment it was posted.

        The three totals are summed from the exercises nested underneath rather
        than stored, the way `FoodMealSerializer` sums a meal's foods, so a figure
        printed under a card cannot disagree with the rows printed inside it. They
        walk `exercises` and nothing else, so a page of them costs no queries as
        long as the feed prefetches that relation.

        There is no `id` here or on the other two snapshots: each is one-to-one with
        its post, the post's id already identifies it, and an id in this position
        invites a client into thinking it can fetch the workout it came from.
      properties:
        title:
          type: string
          readOnly: true
        workout_type:
          type: string
          readOnly: true
          nullable: true
        performed_at:
          type: string
          format: date-time
          readOnly: true
        duration_seconds:
          type: integer
          readOnly: true
          nullable: true
        cardio_machine:
          type: string
          readOnly: true
          nullable: true
        cardio_seconds:
          type: integer
          readOnly: true
          nullable: true
        cardio_distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        route_distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,3})?$
          readOnly: true
          nullable: true
        pace_seconds_per_km:
          type: integer
          readOnly: true
          nullable: true
        elevation_gain_m:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,1})?$
          readOnly: true
          nullable: true
        exercises:
          type: array
          items:
            $ref: '#/components/schemas/PostWorkoutExercise'
          readOnly: true
        exercise_count:
          type: integer
          readOnly: true
        total_set_count:
          type: integer
          readOnly: true
        total_volume_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
          nullable: true
          readOnly: true
      required:
      - cardio_distance_km
      - cardio_machine
      - cardio_seconds
      - duration_seconds
      - elevation_gain_m
      - exercise_count
      - exercises
      - pace_seconds_per_km
      - performed_at
      - route_distance_km
      - title
      - total_set_count
      - total_volume_kg
      - workout_type
