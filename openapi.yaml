components:
  schemas:
    ApplySavedMealRequest:
      type: object
      description: |-
        Which days to copy a saved meal into, and which meal on each of them.

        Days rather than a meal id: the screen that applies a saved meal asks for a
        set of dates and a meal number, and a day the user picked may not have that
        many meals on it yet. Naming an existing meal could not express "meal two on
        each of these three days" without the client first creating whichever meals
        it guessed were missing.

        `position` is the meal's place in the day counting from one, not its
        `position` column: a day whose second meal was deleted still has a second
        meal, and it is the one now sitting where that one was.
      properties:
        dates:
          type: array
          items:
            type: string
            format: date
          maxItems: 31
        position:
          type: integer
          maximum: 12
          minimum: 1
      required:
      - dates
      - position
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/RepbaseUser'
          readOnly: true
      required:
      - token
      - user
    Block:
      type: object
      description: |-
        One person the requester has blocked.

        `blocked_user` is nested beside the plain id because the only screen that
        reads this list is a list of people, and a page of bare ids would be a
        profile fetch each. The id stays because that is what a client sends back to
        lift the block.
      properties:
        id:
          type: integer
          readOnly: true
        blocker:
          type: integer
          readOnly: true
        blocked:
          type: integer
        blocked_user:
          allOf:
          - $ref: '#/components/schemas/PublicRepbaseUser'
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - blocked
      - blocked_user
      - blocker
      - created_at
      - id
    BlockRequest:
      type: object
      description: |-
        One person the requester has blocked.

        `blocked_user` is nested beside the plain id because the only screen that
        reads this list is a list of people, and a page of bare ids would be a
        profile fetch each. The id stays because that is what a client sends back to
        lift the block.
      properties:
        blocked:
          type: integer
      required:
      - blocked
    BodyWeightEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - updated_at
      - weight_kg
    BodyWeightEntryRequest:
      type: object
      properties:
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
      required:
      - weight_kg
    CardioMachineEnum:
      enum:
      - treadmill
      - stationary_bike
      - stair_master
      - elliptical
      - rowing_machine
      - assault_bike
      - ski_erg
      - other
      type: string
      description: |-
        * `treadmill` - Treadmill
        * `stationary_bike` - Stationary Bike
        * `stair_master` - Stair Master
        * `elliptical` - Elliptical
        * `rowing_machine` - Rowing Machine
        * `assault_bike` - Assault Bike
        * `ski_erg` - Ski Erg
        * `other` - Other
    CategoryEnum:
      enum:
      - habit
      - workout
      - errand
      - study
      - sleep
      - health
      - work
      - home
      - birthday
      - holiday
      - appointment
      - meeting
      - travel
      - social
      - other
      type: string
      description: |-
        * `habit` - Habit
        * `workout` - Workout
        * `errand` - Errand
        * `study` - Study
        * `sleep` - Sleep
        * `health` - Health
        * `work` - Work
        * `home` - Home
        * `birthday` - Birthday
        * `holiday` - Holiday
        * `appointment` - Appointment
        * `meeting` - Meeting
        * `travel` - Travel
        * `social` - Social
        * `other` - Other
    ClearScheduleResult:
      type: object
      description: How many planned days were cleared.
      properties:
        cleared:
          type: integer
          readOnly: true
      required:
      - cleared
    ContentTypeEnum:
      enum:
      - image/heic
      - image/jpeg
      - image/png
      - image/webp
      type: string
      description: |-
        * `image/heic` - image/heic
        * `image/jpeg` - image/jpeg
        * `image/png` - image/png
        * `image/webp` - image/webp
    CopyFoodDayRequest:
      type: object
      description: |-
        Which day to copy the eating from, and which day to put it on.

        Two dates rather than "yesterday": the rule about which day is being
        repeated belongs to the screen asking, and the device knows what day it is
        for the person holding it. A server that guessed would be guessing in its
        own timezone.
      properties:
        source_date:
          type: string
          format: date
        target_date:
          type: string
          format: date
      required:
      - source_date
      - target_date
    CreatePostKindEnum:
      enum:
      - workout
      - meal
      - planner
      - repost
      type: string
      description: |-
        * `workout` - Workout
        * `meal` - Meal
        * `planner` - Planner
        * `repost` - Repost
    CreatePostRequest:
      type: object
      description: |-
        What to post, and who may see it.

        A reference and nothing else. The server reads the source itself and builds
        the snapshot from it, so no client can decide what a post says it did —
        accepting the content here would be accepting a five-hundred-kilogram squat
        from anyone who could type one.
      properties:
        kind:
          $ref: '#/components/schemas/CreatePostKindEnum'
        source_id:
          type: integer
          minimum: 1
        caption:
          type: string
          default: ''
          maxLength: 300
        shows_weights:
          type: boolean
          default: true
        visibility:
          allOf:
          - $ref: '#/components/schemas/VisibilityEnum'
          default: public
        content_type:
          $ref: '#/components/schemas/ContentTypeEnum'
        image_base64:
          type: string
          description: 'The image bytes, base64 encoded, without a data: prefix.'
        cooking_instructions:
          type: string
          description: How the meal was made, for a meal post. Ignored for other kinds.
          maxLength: 4000
      required:
      - kind
      - source_id
    CycleActivateRequest:
      type: object
      description: |-
        When the new rotation takes over.

        Optional, and today when it is left out. A date in the future is the point
        of it: the rotation you are on keeps running right up to that day, so
        switching is something you plan rather than something that happens to next
        week the moment you tap.
      properties:
        start_on:
          type: string
          format: date
    CyclePlanAheadRequest:
      type: object
      description: How far forward to write schedule rows.
      properties:
        through:
          type: string
          format: date
      required:
      - through
    CycleShiftRequest:
      type: object
      description: How many days to push the rest of the rotation back.
      properties:
        days:
          type: integer
          maximum: 31
          minimum: 1
      required:
      - days
    CycleShiftResult:
      type: object
      description: What the shift did, counted.
      properties:
        cycle:
          $ref: '#/components/schemas/WorkoutCycle'
        days_shifted:
          type: integer
        removed:
          type: integer
        scheduled:
          type: integer
        kept:
          type: integer
      required:
      - cycle
      - days_shifted
      - kept
      - removed
      - scheduled
    DailyStepCount:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        day:
          type: string
          format: date
        steps:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - day
      - id
      - owner
      - steps
      - updated_at
    DailyStepCountEntryRequest:
      type: object
      description: One day of steps on its way in from the device.
      properties:
        day:
          type: string
          format: date
        steps:
          type: integer
          minimum: 0
      required:
      - day
      - steps
    DailyStepCountRecordRequest:
      type: object
      description: |-
        A batch of days.

        The device sends several at once because Health can backfill: a watch
        synced after a day offline changes yesterday's total, not only today's.
        Sending one day at a time would leave those corrections behind.
      properties:
        days:
          type: array
          items:
            $ref: '#/components/schemas/DailyStepCountEntryRequest'
      required:
      - days
