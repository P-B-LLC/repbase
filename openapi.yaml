    ProfileHighlight:
      type: object
      description: |-
        A featured lift and the set behind it.

        `source` is the important field. "logged" means the server read this out
        of a finished session and can point at the day; "manual" means the person
        typed it; "none" means there is nothing to show yet. A reader is told
        which, because a number nobody logged must not look like one that was.

        A plain string, not a closed enum, so a source added later does not stop an
        older build decoding the profile around it.
      properties:
        lift:
          type: string
          readOnly: true
        lift_label:
          type: string
          readOnly: true
        source:
          type: string
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        reps:
          type: integer
          readOnly: true
          nullable: true
        estimated_one_rep_max_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
          readOnly: true
          nullable: true
        performed_at:
          type: string
          format: date-time
          readOnly: true
          nullable: true
        exercise_name:
          type: string
          readOnly: true
          nullable: true
      required:
      - estimated_one_rep_max_kg
      - exercise_name
      - lift
      - lift_label
      - performed_at
      - reps
      - source
      - weight_kg
    ProfileHighlightWriteRequest:
      type: object
