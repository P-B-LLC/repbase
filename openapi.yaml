      operationId: social_posts_create
      description: Post a workout, meal or planner entry the requester owns. The server
        reads the source and builds the snapshot; the request names the object and
        never carries its contents.
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          description: ''
