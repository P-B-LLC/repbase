  /api/v1/social/posts/:
    get:
      operationId: social_posts_list
      description: |-
        Posts: what someone has chosen to show other people.

        Reading and writing use different querysets on purpose. A reader gets
        everything the visibility rules allow; an author gets their own rows and
        nothing else, so somebody else's post is a 404 to a PATCH for the same
        reason it is a 404 to a GET of a session that is not theirs — it was never
        in the set.
      parameters:
      - in: query
        name: author
        schema:
          type: integer
        description: Return only posts by this user, still filtered by what the reader
          is allowed to see.
      - in: query
        name: from_following
        schema:
          type: boolean
        description: Split the list by whether the reader follows the author. `true`
          is the people they follow; `false` is the people they do not, and also drops
          the reader's own posts, because a page for finding new people should not
          open with your own. Omitted, the list is everybody. Anything other than
          true or false is a 400 rather than a guess.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: search
        schema:
          type: string
        description: 'Return only posts matching this, ignoring case: the caption,
          the author''s username or name, the title of the workout, meal or planner
          entry attached, or the name of a food or exercise inside it — so a meal
          posted as "Meal 1" is still found by the chicken in it. Narrows what the
          reader is already allowed to see and never widens it, so a post hidden from
          them stays hidden however well it matches. Combines with `author` when both
          are given.'
      tags:
      - social
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
          description: ''
