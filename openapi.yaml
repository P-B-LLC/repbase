  /api/v1/social/feed/:
    get:
      operationId: social_feed_list
      description: |-
        What the people you follow have posted, newest first.

        Fanned out on read: a page is one indexed walk over the posts of everyone
        the reader follows. Fanning out on write would mean a row per follower per
        post, nearly all of them never looked at, and a second copy of the
        visibility rules to keep in step with this one.

        The reader's own posts are in it, minus the private ones. Posting and being
        returned to a feed that does not contain what you just posted reads as a
        failure, and this is the cheapest confirmation the app can give; a private
        post is one deliberately held back, so it stays on the profile list where it
        was put and out of the stream that exists to be shared.
      parameters:
      - in: query
        name: cursor
        schema:
          type: string
        description: The position carried by the previous page's `next` link. Absent
          means start at the newest post.
      - in: query
        name: page_size
        schema:
          type: integer
        description: How many posts to return, at most 50. Asking for more is refused
          rather than reduced, so a page is always the size it was asked for.
      tags:
      - social
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
          description: ''
  /api/v1/social/posts/:
    get:
      operationId: social_posts_list
      description: |-
        Posts: what someone has chosen to show other people.

        Reading and writing use different querysets on purpose. A reader gets
        everything the visibility rules allow; an author gets their own rows and
        nothing else, so somebody else's post is a 404 to a PATCH for the same
        reason it is a 404 to a GET of a session that is not theirs — it was never
        in the set.
      parameters:
      - in: query
        name: author
        schema:
          type: integer
        description: Return only posts by this user, still filtered by what the reader
          is allowed to see.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      tags:
      - social
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedPostList'
          description: ''
    post:
      operationId: social_posts_create
      description: Post a workout, meal or planner entry the requester owns. The server
        reads the source and builds the snapshot; the request names the object and
        never carries its contents.
      tags:
      - social
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/CreatePostRequest'
        required: true
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '201':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Post'
          description: ''
