      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '204':
          description: No response body
  /api/v1/food/entries/:
    get:
      operationId: food_entries_list
      description: Foods inside meals. Ownership is the meal's owner, one step away.
