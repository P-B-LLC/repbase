    PasswordResetConfirmRequest:
      type: object
      description: |-
        Spending a code on a new password.

        The email comes back with it so the code is only ever checked against the
        account it was issued for; a code good for whoever happens to present it
        would be a six digit skeleton key.
      properties:
        email:
          type: string
          format: email
          minLength: 1
        code:
          type: string
          minLength: 6
          maxLength: 6
        new_password:
          type: string
          writeOnly: true
          minLength: 8
      required:
      - code
      - email
      - new_password
    PasswordResetRequestRequest:
      type: object
      description: |-
        Asking for a code.

        Takes an email and nothing else, and the view answers the same way
        whether or not an account has it. Telling an unauthenticated caller which
        addresses are registered turns this into a way to enumerate the userbase.
      properties:
        email:
          type: string
          format: email
          minLength: 1
      required:
      - email
    PatchedBodyWeightEntryRequest:
      type: object
      properties:
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
    PatchedExerciseRequest:
      type: object
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        muscle_group:
          type: string
          maxLength: 100
    PatchedFoodEntryRequest:
      type: object
      description: |-
        One food. Nutrition is per serving; totals are derived, never stored,
        so a serving count and its totals cannot drift apart.
      properties:
        meal:
          type: integer
        name:
          type: string
          minLength: 1
          maxLength: 150
        servings:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        calories:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        protein_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        carbohydrate_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        fat_grams:
          type: string
          format: decimal
          pattern: ^-?\d{0,6}(?:\.\d{0,2})?$
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
    PatchedFoodMealRequest:
      type: object
      description: |-
        A meal with its foods nested, so drawing a day is one request rather
        than one per meal.
      properties:
        date:
          type: string
          format: date
        name:
          type: string
          minLength: 1
          maxLength: 100
        position:
          type: integer
          maximum: 9223372036854775807
          minimum: 0
          format: int64
    PatchedGearRequest:
      type: object
      properties:
        kind:
          $ref: '#/components/schemas/GearKindEnum'
        name:
          type: string
          minLength: 1
          maxLength: 80
        brand:
          type: string
          maxLength: 60
        notes:
          type: string
        initial_distance_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
        retire_at_km:
          type: string
          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,3})?$
          nullable: true
        is_default:
          type: boolean
          default: false
        retired_at:
          type: string
          format: date-time
          nullable: true
    PatchedGymRequest:
      type: object
      description: A gym, and how many people say they train there.
      properties:
        name:
          type: string
          minLength: 1
          maxLength: 150
        city:
