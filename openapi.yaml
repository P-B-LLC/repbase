  /api/v1/food/goals/:
    get:
      operationId: food_goals_retrieve
      description: The signed-in user's daily targets. A singleton, so no list or
        id.
      tags:
      - food
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/NutritionGoal'
          description: ''
    patch:
      operationId: food_goals_partial_update
      description: The signed-in user's daily targets. A singleton, so no list or
        id.
      tags:
      - food
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PatchedNutritionGoalRequest'
          application/x-www-form-urlencoded:
            schema:
              $ref: '#/components/schemas/PatchedNutritionGoalRequest'
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/PatchedNutritionGoalRequest'
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
