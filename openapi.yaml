  /api/v1/food/meals/:
    get:
      operationId: food_meals_list
      description: |-
        Meals, with their foods nested on read.

        A day is drawn from one request rather than one per meal, which is why the
        entries come back inside the meal instead of behind another call.
      parameters:
      - in: query
        name: end
        schema:
          type: string
          format: date
        description: Return only meals on or before this date.
      - name: page
        required: false
        in: query
        description: A page number within the paginated result set.
        schema:
          type: integer
      - in: query
        name: start
        schema:
          type: string
          format: date
        description: Return only meals on or after this date.
      tags:
      - food
      security:
      - tokenAuth: []
      - cookieAuth: []
      responses:
        '200':
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PaginatedFoodMealList'
