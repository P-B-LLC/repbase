components:
  schemas:
    AuthResponse:
      type: object
      properties:
        token:
          type: string
          readOnly: true
        user:
          allOf:
          - $ref: '#/components/schemas/RepbaseUser'
          readOnly: true
      required:
      - token
      - user
    BlankEnum:
      enum:
      - ''
    BodyWeightEntry:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        owner:
          type: integer
          readOnly: true
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - id
      - owner
      - updated_at
      - weight_kg
    BodyWeightEntryRequest:
      type: object
      properties:
        weight_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,4}(?:\.\d{0,2})?$
        recorded_at:
          type: string
          format: date-time
        notes:
          type: string
          maxLength: 300
      required:
      - weight_kg
    Exercise:
      type: object
      properties:
        id:
          type: integer
          readOnly: true
        name:
          type: string
          maxLength: 150
        muscle_group:
          type: string
          maxLength: 100
        created_by:
          type: integer
          readOnly: true
        created_at:
          type: string
          format: date-time
          readOnly: true
        updated_at:
          type: string
          format: date-time
          readOnly: true
      required:
      - created_at
      - created_by
      - id
      - name
      - updated_at
