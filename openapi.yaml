          format: decimal
          pattern: ^-?\d{0,5}(?:\.\d{0,2})?$
        reps:
          type: integer
        volume_kg:
          type: string
          format: decimal
          pattern: ^-?\d{0,10}(?:\.\d{0,2})?$
      required:
