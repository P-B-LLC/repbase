name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Callable, so the release gate runs exactly these checks rather than a
  # second copy of them that can drift away from the ones that matter.
  workflow_call:

jobs:
  # The whole suite, against the database this actually ships on.
  #
  # It used to run two modules -- the ones written for the row-lock work --
  # and that was backwards. The recovery tests were the ones LEAST in need of
  # a real database, because they were written knowing they needed one. The
  # risk lives in the other 299, which were all written against SQLite and
  # have never once touched PostgreSQL.
  #
  # SQLite forgives things PostgreSQL does not: it serialises writers, so a
  # missing row lock passes; it returns small tables in insertion order, so a
  # query with no ORDER BY looks stable; it ignores GROUP BY rules that
  # PostgreSQL enforces. Two real bugs here were exactly that shape -- a
  # select_for_update on an aggregated query, and a paginator whose ordering
  # had been silently dropped -- and both passed every SQLite run.
  postgres:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rytivo_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.test_postgres
      TEST_POSTGRES_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
      - run: pip install -r requirements-production.txt
      - run: python manage.py test core
      - name: Check production settings without contacting hosted services
        env:
          DJANGO_SETTINGS_MODULE: config.production
          DJANGO_DEBUG: "false"
          DJANGO_SECRET_KEY: ci-configuration-test-only-not-a-real-secret-0123456789-abcdefghij
          DJANGO_ALLOWED_HOSTS: api.example.com
          DATABASE_URL: postgresql://test:test@database.example.com/rytivo
          REDIS_URL: rediss://:test@cache.example.com:6379/0
          DJANGO_MEDIA_ROOT: /tmp/rytivo-ci-media
          SMTP_HOST: smtp.example.com
          SMTP_USERNAME: test
          DEFAULT_FROM_EMAIL: test@example.com
        run: python manage.py check --deploy --fail-level ERROR

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.14"
          cache: pip

      - run: pip install -r requirements.txt

      # Includes ContractMatchesResponsesTests, which checks that responses
      # match the schema describing them. Two shipped bugs came from those
      # disagreeing -- a saved-meal id documented as a string and returned as
      # a number, and a created_by documented as an integer that is null on
      # everything the app ships with. Both broke the generated iOS client on
      # a live screen while every existing test passed, because until then no
      # test compared what the server sends against what it promises.
      - run: python manage.py test core

      # The contract is committed to the iOS repo and the client is generated
      # from it, so a schema change that nobody regenerated is a client that
      # no longer matches the server.
      - name: openapi.yaml is up to date with the serializers
        run: |
          python manage.py spectacular --file /tmp/openapi.yaml
          if ! diff -q openapi.yaml /tmp/openapi.yaml > /dev/null 2>&1; then
            echo "openapi.yaml is stale. Regenerate it and copy it to the iOS repo:"
            echo "  python manage.py spectacular --file openapi.yaml"
            diff openapi.yaml /tmp/openapi.yaml | head -40
            exit 1
          fi
