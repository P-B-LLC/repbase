name: Cookbook integration
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'core/cookbook*'
      - 'core/test_cookbooks.py'
      - 'core/migrations/0087_cookbooks.py'
      - 'core/models.py'
      - 'core/serializers.py'
      - 'core/views.py'
      - '.github/workflows/cookbooks.yml'
permissions:
  contents: read
concurrency:
  group: cookbooks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  postgres-cookbooks:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_DB: rytivo_test
          POSTGRES_PASSWORD: local-ci-only
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s
          --health-timeout 5s --health-retries 10
    env:
      DJANGO_SETTINGS_MODULE: config.test_postgres
      TEST_POSTGRES_PASSWORD: local-ci-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          cache: pip
      - run: pip install -r requirements.txt
      - name: Verify cookbook concurrency, migration, sharing and existing recipe behavior
        run: >-
          python manage.py test core.test_cookbooks
          core.tests.SavingTwiceSavesOnceTests core.tests.SavingKeepsTheRecipeTests
          core.tests.TheRecipeHasACeilingTests core.test_save_recovery
      - run: python manage.py makemigrations --check --dry-run
