# Include inside the HTTPS rytivo.app server, before the generic API location.
location /_private_video/ {
    internal;
    alias /var/lib/rytivo/videos/;
    access_log /var/log/nginx/rytivo-video-access.log rytivo_video;
    error_log /dev/null;
    add_header X-Content-Type-Options nosniff always;
    add_header Cache-Control "private, no-store" always;
    add_header Strict-Transport-Security "max-age=3600" always;
}
location = /api/v1/video-assets/ {
    access_log /var/log/nginx/rytivo-video-access.log rytivo_video;
    error_log /dev/null;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
location ~ ^/api/v1/social/posts/[0-9]+/video/$ {
    client_max_body_size 15m;
    client_body_timeout 30s;
    limit_conn video_uploads 2;
    limit_conn_status 429;
    proxy_request_buffering on;
    proxy_read_timeout 60s;
    proxy_pass http://127.0.0.1:8001;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto https;
}
